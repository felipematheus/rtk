[filters.flutter-test]
description = "Compact flutter test — failures only: strip pub preamble and passing progress, rewrite [E] lines to FAIL, keep failure details and summary"
match_command = "^flutter\\s+test\\b"
strip_ansi = true
filter_stderr = true
# See dart-test.toml: [E] is the only reliable failure marker in the compact
# reporter; cumulative -N counters also appear on passing lines after the
# first failure.
replace = [
  { pattern = "^\\d\\d:\\d\\d\\s+\\+\\d+(?:\\s+~\\d+)?(?:\\s+-\\d+)?:\\s+(.+?)\\s*\\[E\\]\\s*$", replacement = "FAIL $1" },
  { pattern = "^\\d\\d:\\d\\d\\s+\\+(\\d+)(?:\\s+~(\\d+))?\\s+-(\\d+):\\s+Some tests failed\\.?\\s*$", replacement = "Some tests failed ($1 passed, $3 failed)." },
]
match_output = [
  { pattern = "All tests passed!", message = "ok flutter test: all passed", unless = "(?m)^FAIL |Some tests failed" },
]
strip_lines_matching = [
  "^\\s*$",
  "^\\d\\d:\\d\\d\\s+\\+\\d+",
  "^Resolving dependencies",
  "^Downloading packages",
  "^Got dependencies!",
  "^  [a-zA-Z_][a-zA-Z0-9_-]* \\d",
  "^\\d+ packages have newer",
  "^Try `flutter pub outdated`",
  "^The following plugins do not support",
  "^  - [a-zA-Z0-9_]+$",
  "^This will become an error",
  "^Running",
  "^\\[\\+\\d+ ms\\] ",
  "^Consider enabling the flag chain-stack-traces",
]
max_lines = 200

[[tests.flutter-test]]
name = "all passing with pub preamble — short-circuits"
input = """
Resolving dependencies...
Downloading packages...
  _fe_analyzer_shared 96.0.0 (103.0.0 available)
  meta 1.18.0 (1.18.3 available)
Got dependencies!

00:00 +0: loading test/widget_test.dart
00:00 +0: test/widget_test.dart: counter increments
00:00 +1: test/widget_test.dart: smoke test
00:00 +2: All tests passed!
"""
expected = "ok flutter test: all passed"

[[tests.flutter-test]]
name = "failures only — pub noise, plugin warnings, and passing lines stripped"
input = """
Resolving dependencies...
Downloading packages...
  _fe_analyzer_shared 96.0.0 (103.0.0 available)
Got dependencies!
59 packages have newer versions incompatible with dependency constraints.
Try `flutter pub outdated` for more information.
The following plugins do not support Swift Package Manager for ios:
  - patrol
  - flutter_secure_storage
This will become an error in a future version of Flutter.
The following plugins do not support Swift Package Manager for macos:
  - patrol
  - flutter_secure_storage_macos
This will become an error in a future version of Flutter.

00:00 +0: loading test/widget_test.dart
00:00 +0: test/widget_test.dart: passing widget test
00:00 +1: test/auth_test.dart: login fails
00:00 +1 -1: test/auth_test.dart: login fails [E]
  Expected: true
    Actual: false

  package:test_api            expect
  test/auth_test.dart 12:5    main.<fn>

00:00 +1 -1: test/widget_test.dart: another pass
00:00 +2 -1: Some tests failed.
Failing tests:
  test/auth_test.dart: login fails
"""
expected = """FAIL test/auth_test.dart: login fails
  Expected: true
    Actual: false
  package:test_api            expect
  test/auth_test.dart 12:5    main.<fn>
Some tests failed (2 passed, 1 failed).
Failing tests:
  test/auth_test.dart: login fails"""

[[tests.flutter-test]]
name = "late failure after long passing run is not buried"
input = """
00:00 +0: loading test/big_test.dart
